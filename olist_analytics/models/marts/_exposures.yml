exposures:
  - name: olist_revenue_dashboard
    label: "Olist Revenue & Delivery Dashboard - GUI"
    type: dashboard
    maturity: high
    url: http://localhost:3000/dashboard/3-olist-revenue-delivery-dashboard-gui
    description: >
      Metabase dashboard: Net Delivered Revenue, revenue by
      state/category, and delivery time vs. review score. The Model
      and Metric are built on fct_orders/fct_order_items; the breakdown cards
      join in dim_customers and dim_products for the descriptive attributes,
      and the trend card joins dim_dates for the month label.
    depends_on:
      - ref('fct_order_items')
      - ref('fct_orders')
      - ref('dim_customers')
      - ref('dim_products')
      - ref('dim_dates')
    owner:
      name: Christos Frantzis
      email: christos.n.fran@gmail.com