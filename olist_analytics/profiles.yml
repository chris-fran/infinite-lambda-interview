olist_analytics:
  target: dev
  outputs:

    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: TRANSFORMER
      warehouse: TRANSFORM_WH
      database: OLIST_DEV
      schema: DBT_DEV
      threads: 4

    test:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_CI_USER') }}"
      private_key: "{{ env_var('SNOWFLAKE_CI_PRIVATE_KEY') }}"
      role: TRANSFORMER
      warehouse: TRANSFORM_WH
      database: OLIST_TEST
      schema: DBT_TEST
      threads: 4

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_CI_USER') }}"
      private_key: "{{ env_var('SNOWFLAKE_CI_PRIVATE_KEY') }}"
      role: TRANSFORMER
      warehouse: TRANSFORM_WH
      database: OLIST_PROD
      schema: DBT_PROD
      threads: 4
